# Builds the installable Android APK (release, arm64-v8a + x86_64) without an
# Expo account: `expo prebuild` (CNG) + Gradle assembleRelease. Equivalent to
# `eas build -p android --profile preview` (see eas.json). On a v* tag the APK
# is attached to the GitHub Release.
name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPO_PUBLIC_API_URL: https://forward-api-java.fly.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - name: Expo prebuild (android)
        run: npx expo prebuild -p android --clean --no-install
        env:
          CI: 1
      - name: Gradle assembleRelease
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon
      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/ForwardService-${GITHUB_REF_NAME//\//-}.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: forwardservice-apk
          path: dist/
          retention-days: 30
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
